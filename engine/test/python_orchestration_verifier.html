<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WindowControl Python orchestration verifier</title>
  <style>
    body { font: 15px system-ui,sans-serif; max-width: 960px; margin: 24px auto; padding: 0 16px; }
    video { width: min(720px,100%); background: #111; display: block; }
    #status { font-weight: 600; } #log { white-space: pre-wrap; background:#f2f2f2; padding:12px; }
  </style>
</head>
<body>
  <h1>Python orchestration verifier</h1>
  <p>Status: <span id="status">disconnected</span></p>
  <p>ICE: <code id="ice">-</code> · DataChannel: <code id="channel">-</code> · generation: <code id="generation">-</code> · dimensions: <code id="dimensions">-</code></p>
  <p>WHEP resource: <code id="resource">-</code> · framesDecoded: <code id="frames">0</code></p>
  <video id="video" autoplay playsinline muted></video>
  <pre id="log"></pre>
  <script>
    // The runner puts selection metadata in the fragment. This page performs
    // no cross-origin API calls; fragments are not sent to the static server.
    const statusEl = document.querySelector('#status');
    const generationEl = document.querySelector('#generation');
    const dimensionsEl = document.querySelector('#dimensions');
    const iceEl = document.querySelector('#ice');
    const channelEl = document.querySelector('#channel');
    const resourceEl = document.querySelector('#resource');
    const framesEl = document.querySelector('#frames');
    const logEl = document.querySelector('#log');
    const videoEl = document.querySelector('#video');
    let peer = null;
    let inputChannel = null;
    let resourceUrl = null;
    let lastFramesDecoded = 0;

    function log(...parts) {
      const line = parts.map(String).join(' ');
      console.log(line); logEl.textContent += line + '\n';
    }
    function status(value) { statusEl.textContent = value; log('status:', value); }
    function selectionFromFragment() {
      if (!location.hash) throw new Error('runner selection fragment is missing');
      const encoded = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
      const padded = encoded + '='.repeat((4 - encoded.length % 4) % 4);
      return JSON.parse(atob(padded));
    }
    async function connect() {
      const selection = selectionFromFragment();
      generationEl.textContent = selection.generation;
      dimensionsEl.textContent = `${selection.width}x${selection.height}`;
      peer = new RTCPeerConnection({iceServers: selection.ice_servers || []});
      peer.addTransceiver('video', {direction:'recvonly'});
      inputChannel = peer.createDataChannel('input');
      inputChannel.onopen = () => { channelEl.textContent = 'open'; log('input channel open'); status('connected (input ready)'); };
      inputChannel.onclose = () => log('input channel closed');
      inputChannel.onerror = event => log('input channel error', event);
      peer.ontrack = event => {
        videoEl.srcObject = event.streams[0] || new MediaStream([event.track]);
        status('receiving video');
      };
      peer.oniceconnectionstatechange = () => { iceEl.textContent = peer.iceConnectionState; log('ICE state:', peer.iceConnectionState); };
      const offer = await peer.createOffer();
      await peer.setLocalDescription(offer);
      if (peer.iceGatheringState !== 'complete') await new Promise(resolve => {
        const done = () => { if (peer.iceGatheringState === 'complete') { peer.removeEventListener('icegatheringstatechange', done); resolve(); } };
        peer.addEventListener('icegatheringstatechange', done);
      });
      const response = await fetch(selection.whep_url, {
        method:'POST',
        headers:{'Content-Type':'application/sdp', 'Authorization':`Bearer ${selection.whep_token}`},
        body:peer.localDescription.sdp,
      });
      if (!response.ok) throw new Error(`WHEP ${response.status}`);
      const locationHeader = response.headers.get('Location');
      resourceUrl = locationHeader ? new URL(locationHeader, selection.whep_url).href : null;
      resourceEl.textContent = resourceUrl ? 'received' : 'missing';
      log('WHEP resource location received:', Boolean(resourceUrl));
      await peer.setRemoteDescription({type:'answer', sdp:await response.text()});
      log('WHEP negotiation complete');
    }
    async function cleanup() {
      if (resourceUrl) {
        try { await fetch(resourceUrl, {method:'DELETE', keepalive:true}); log('WHEP resource DELETE sent'); }
        catch (error) { log('WHEP resource DELETE failed', error); }
      }
      if (peer) peer.close();
    }
    videoEl.addEventListener('click', event => {
      if (!inputChannel || inputChannel.readyState !== 'open') return log('input channel is not open');
      const rect = videoEl.getBoundingClientRect();
      inputChannel.send(JSON.stringify({type:'click', x:(event.clientX-rect.left)/rect.width, y:(event.clientY-rect.top)/rect.height}));
      log('click input sent');
    });
    setInterval(async () => {
      if (!peer) return;
      const stats = await peer.getStats();
      stats.forEach(report => {
        if (report.type === 'inbound-rtp' && (report.kind === 'video' || report.mediaType === 'video')) {
          lastFramesDecoded = report.framesDecoded || 0;
          framesEl.textContent = lastFramesDecoded;
          log('framesDecoded:', lastFramesDecoded, 'framesReceived:', report.framesReceived || 0);
        }
      });
    }, 5000);
    window.addEventListener('beforeunload', () => { cleanup(); });
    connect().catch(error => { status('error'); log('connection failed', error); });
  </script>
</body>
</html>
