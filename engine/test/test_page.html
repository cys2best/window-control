<!-- engine/test/test_page.html -->
<!DOCTYPE html>
<html>
<head><title>WebRTC PoC Viewer</title></head>
<body>
  <h1>WebRTC PoC Viewer</h1>
  <p>Status: <span id="status">disconnected</span></p>
  <p>Click the video to send a tap through the DataChannel.</p>
  <video id="video" autoplay playsinline muted style="width: 720px; background: #000;"></video>
  <script>
    const params = new URLSearchParams(window.location.search);
    const whepUrl = params.get('whep') || 'http://localhost:8000/whep';

    const statusEl = document.getElementById('status');
    const videoEl = document.getElementById('video');

    const pc = new RTCPeerConnection();
    let inputChannel = null;
    let resourceUrl = null; // For later DELETE

    pc.ontrack = (event) => {
      console.log('ontrack fired, streams:', event.streams.length, 'track:', event.track.kind, event.track.readyState);
      // No a=msid on the engine's SDP means event.streams can be empty —
      // fall back to wrapping the track directly instead of relying on a
      // MediaStream the remote description never declared.
      videoEl.srcObject = event.streams[0] || new MediaStream([event.track]);
      statusEl.textContent = 'receiving video';
    };

    pc.oniceconnectionstatechange = () => {
      statusEl.textContent = 'ICE: ' + pc.iceConnectionState;
      console.log('ICE state:', pc.iceConnectionState);
    };

    videoEl.addEventListener('click', (event) => {
      if (!inputChannel || inputChannel.readyState !== 'open') {
        console.warn('input channel not open yet');
        return;
      }
      const rect = videoEl.getBoundingClientRect();
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = (event.clientY - rect.top) / rect.height;
      // Send canonical click message with normalized coordinates.
      inputChannel.send(JSON.stringify({ type: 'click', x: nx, y: ny }));
    });

    // Viewer creates the input DataChannel and sends messages to engine.
    inputChannel = pc.createDataChannel('input');
    inputChannel.onopen = () => {
      console.log('input channel open');
      statusEl.textContent = statusEl.textContent + ' (input ready)';
    };
    inputChannel.onclose = () => console.log('input channel closed');
    inputChannel.onerror = (event) => console.error('input channel error:', event);

    async function connect() {
      try {
        statusEl.textContent = 'connecting...';

        // Viewer is offerer: add recvonly video transceiver and create offer.
        pc.addTransceiver('video', { direction: 'recvonly' });
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        // Wait for ICE gathering to complete.
        if (pc.iceGatheringState !== 'complete') {
          await new Promise((resolve) => {
            const handler = () => {
              if (pc.iceGatheringState === 'complete') {
                pc.removeEventListener('icegatheringstatechange', handler);
                resolve();
              }
            };
            pc.addEventListener('icegatheringstatechange', handler);
          });
        }

        console.log('Sending offer SDP:\n' + pc.localDescription.sdp);

        // POST offer to WHEP endpoint.
        const response = await fetch(whepUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/sdp' },
          body: pc.localDescription.sdp,
        });

        if (!response.ok) {
          statusEl.textContent = `WHEP error: ${response.status}`;
          console.error('WHEP POST failed:', response.status, response.statusText);
          return;
        }

        // Capture Location header for later DELETE.
        resourceUrl = response.headers.get('Location');
        console.log('WHEP Location:', resourceUrl);

        // Read answer SDP from response body.
        const answerSdp = await response.text();
        console.log('Received answer SDP:\n' + answerSdp);

        await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
        statusEl.textContent = 'connected, waiting for video...';
      } catch (error) {
        statusEl.textContent = 'connection error';
        console.error('Connection failed:', error);
      }
    }

    connect();
  </script>
</body>
</html>
