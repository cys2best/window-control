[project]
name = "window-control"
version = "2.1.4"
description = "Stream Windows app windows to iPhone over Tailscale"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=14.0",  # >=14: asyncio client `additional_headers` (http_tunnel)
    "Pillow>=10.0.0",
    "qrcode[pil]>=7.4.2",
    "pystray>=0.19.5",
    "PyQt5>=5.15.10",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pyinstaller>=6.6.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
