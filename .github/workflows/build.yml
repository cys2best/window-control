name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-engine:
    runs-on: windows-latest
    env:
      # Scripts observed in Windows run 37001202701; registry versions stay
      # pinned separately in engine/vcpkg-configuration.json.
      VCPKG_REVISION: 617ef1c0c422737d117eda00a471ea1be5bad088

    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned vcpkg scripts
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REVISION }}
          path: .vcpkg
          fetch-depth: 0

      - name: Bootstrap pinned vcpkg
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
        shell: pwsh

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            engine/build/vcpkg_installed
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_REVISION }}-${{ hashFiles('engine/vcpkg.json', 'engine/vcpkg-configuration.json', 'engine/ports/**') }}

      - name: Configure (CMake + vcpkg manifest install)
        run: |
          cmake -S engine -B engine\build `
            "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/.vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_OVERLAY_PORTS=engine/ports
        shell: pwsh

      - name: Build
        run: cmake --build engine\build --config Release
        shell: pwsh

      - name: Copy manifest runtime DLLs beside executables
        # libnice/GLib use UNKNOWN imported targets, so CMake's
        # TARGET_RUNTIME_DLLS cannot discover their complete DLL closure.
        run: Copy-Item engine\build\vcpkg_installed\x64-windows\bin\*.dll engine\build\Release\
        shell: pwsh

      - name: Run engine_tests
        run: |
          engine\build\Release\engine_tests.exe
          if ($LASTEXITCODE -ne 0) {
            throw "engine_tests.exe failed with exit code $LASTEXITCODE"
          }
        shell: pwsh

      - name: Stage engine.exe + runtime DLLs (flat)
        run: |
          New-Item -ItemType Directory -Force -Path engine\dist | Out-Null
          Copy-Item engine\build\Release\engine.exe engine\dist\
          Copy-Item engine\build\Release\*.dll engine\dist\
        shell: pwsh

      - name: Upload engine.exe artifact (with runtime DLLs)
        uses: actions/upload-artifact@v4
        with:
          name: engine-windows
          path: engine\dist\*
          retention-days: 30

  build:
    needs: build-engine
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Sync version from config.py
        run: uv run python scripts/bump_version.py

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress
        shell: cmd

      - name: Download scrcpy/mediamtx binaries
        run: uv run python scripts/download_assets.py
        shell: cmd

      - name: Download engine.exe artifact
        uses: actions/download-artifact@v4
        with:
          name: engine-windows
          path: src\assets\engine

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build apps/web's static export
        # npm is a .cmd shim: without `call`, cmd ends the script after the
        # first one and the build line never runs.
        run: |
          call npm install || exit /b 1
          call npm run build -w apps/web || exit /b 1
        shell: cmd

      - name: Build EXE with PyInstaller
        run: uv run pyinstaller build/window_control.spec --distpath dist --workpath build/work --noconfirm
        shell: cmd

      - name: Download VC++ Redistributable
        run: |
          curl -L -o build\vc_redist.x64.exe "https://aka.ms/vs/17/release/vc_redist.x64.exe"
        shell: cmd

      - name: Build installer with Inno Setup
        run: |
          mkdir release
          ISCC build\installer.iss
        shell: cmd

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowControlInstaller
          path: release/WindowControlInstaller.exe
          retention-days: 30

      - name: Upload to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/WindowControlInstaller.exe
