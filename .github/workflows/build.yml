name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-engine:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\buildtrees
            C:\vcpkg\downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('engine/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure (CMake + vcpkg manifest install)
        run: |
          cmake -S engine -B engine\build `
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows
        shell: pwsh

      - name: Build
        run: cmake --build engine\build --config Release
        shell: pwsh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install signaling relay dependencies
        run: npm ci
        working-directory: infra/vps/signaling
        shell: cmd

      - name: Run complete engine_tests behind the Node signaling relay
        run: |
          $env:JWT_SECRET = ""
          $relay = Start-Process node -ArgumentList "server.js" `
            -WorkingDirectory "infra\vps\signaling" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            $connected = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $client = New-Object System.Net.Sockets.TcpClient
                $client.Connect("127.0.0.1", 8443)
                $client.Close()
                $connected = $true
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $connected) {
              throw "signaling relay did not accept connections on port 8443"
            }
            engine\build\Release\engine_tests.exe
            if ($LASTEXITCODE -ne 0) {
              throw "engine_tests.exe failed with exit code $LASTEXITCODE"
            }
          } finally {
            Stop-Process -Id $relay.Id -ErrorAction SilentlyContinue
            Wait-Process -Id $relay.Id -ErrorAction SilentlyContinue
          }
        shell: pwsh

      - name: Stage engine.exe + runtime DLLs (flat)
        run: |
          New-Item -ItemType Directory -Force -Path engine\dist | Out-Null
          Copy-Item engine\build\Release\engine.exe engine\dist\
          Copy-Item engine\build\Release\*.dll engine\dist\
        shell: pwsh

      - name: Upload engine.exe artifact (with runtime DLLs)
        uses: actions/upload-artifact@v4
        with:
          name: engine-windows
          path: engine\dist\*
          retention-days: 30

  build:
    needs: build-engine
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Sync version from config.py
        run: uv run python scripts/bump_version.py

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress
        shell: cmd

      - name: Download scrcpy/mediamtx binaries
        run: uv run python scripts/download_assets.py
        shell: cmd

      - name: Download engine.exe artifact
        uses: actions/download-artifact@v4
        with:
          name: engine-windows
          path: src\assets\engine

      - name: Build EXE with PyInstaller
        run: uv run pyinstaller build/window_control.spec --distpath dist --workpath build/work --noconfirm
        shell: cmd

      - name: Download VC++ Redistributable
        run: |
          curl -L -o build\vc_redist.x64.exe "https://aka.ms/vs/17/release/vc_redist.x64.exe"
        shell: cmd

      - name: Build installer with Inno Setup
        run: |
          mkdir release
          ISCC build\installer.iss
        shell: cmd

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowControlInstaller
          path: release/WindowControlInstaller.exe
          retention-days: 30

      - name: Upload to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/WindowControlInstaller.exe
