name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-engine:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\buildtrees
            C:\vcpkg\downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('engine/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure (CMake + vcpkg manifest install)
        run: |
          cmake -S engine -B engine\build `
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows
        shell: pwsh

      - name: Build
        run: cmake --build engine\build --config Release
        shell: pwsh

      - name: Run engine_tests (excludes SignalingClient — no server available in CI)
        run: |
          engine\build\Release\engine_tests.exe --gtest_filter=-SignalingClient.*
        shell: pwsh

      - name: Upload engine.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-windows
          path: engine\build\Release\engine.exe
          retention-days: 30

  build:
    needs: build-engine
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Sync version from config.py
        run: uv run python scripts/bump_version.py

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress
        shell: cmd

      - name: Download scrcpy/mediamtx binaries
        run: uv run python scripts/download_assets.py
        shell: cmd

      - name: Download engine.exe artifact
        uses: actions/download-artifact@v4
        with:
          name: engine-windows
          path: src\assets\engine

      - name: Build EXE with PyInstaller
        run: uv run pyinstaller build/window_control.spec --distpath dist --workpath build/work --noconfirm
        shell: cmd

      - name: Download VC++ Redistributable
        run: |
          curl -L -o build\vc_redist.x64.exe "https://aka.ms/vs/17/release/vc_redist.x64.exe"
        shell: cmd

      - name: Build installer with Inno Setup
        run: |
          mkdir release
          ISCC build\installer.iss
        shell: cmd

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowControlInstaller
          path: release/WindowControlInstaller.exe
          retention-days: 30

      - name: Upload to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/WindowControlInstaller.exe
