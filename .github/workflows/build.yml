name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-engine:
    runs-on: windows-latest
    env:
      # The runner image's C:\vcpkg moves with every image update, which
      # changes vcpkg's ABI hashes and forces a full rebuild of every port.
      # Pinning the scripts keeps the cached vcpkg_installed tree reusable.
      VCPKG_REVISION: 617ef1c0c422737d117eda00a471ea1be5bad088

    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned vcpkg scripts
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REVISION }}
          path: .vcpkg
          # The builtin registry baseline is resolved from git history.
          fetch-depth: 0

      - name: Bootstrap pinned vcpkg
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
        shell: pwsh

      - name: Restore vcpkg cache
        # Manifest mode installs into the build tree, not C:\vcpkg\installed.
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            engine/build/vcpkg_installed
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_REVISION }}-${{ hashFiles('engine/vcpkg.json', 'engine/vcpkg-configuration.json') }}

      - name: Configure (CMake + vcpkg manifest install)
        # GitHub serves a mix of runner image versions, and vcpkg's package
        # ABI hashes cmake/PowerShell versions, so a restored tree is rebuilt
        # whenever the image differs. On a cache hit, skip the install and use
        # the restored DLLs as-is (MSVC v14x keeps binary compatibility).
        run: |
          cmake -S engine -B engine\build `
            "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/.vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            "-DVCPKG_MANIFEST_INSTALL=$(if ('${{ steps.vcpkg-cache.outputs.cache-hit }}' -eq 'true') { 'OFF' } else { 'ON' })"
        shell: pwsh

      - name: Build
        run: cmake --build engine\build --config Release --parallel
        shell: pwsh

      - name: Run engine_tests
        run: |
          engine\build\Release\engine_tests.exe
          if ($LASTEXITCODE -ne 0) {
            throw "engine_tests.exe failed with exit code $LASTEXITCODE"
          }
        shell: pwsh

      - name: Stage engine.exe + runtime DLLs (flat)
        run: |
          New-Item -ItemType Directory -Force -Path engine\dist | Out-Null
          Copy-Item engine\build\Release\engine.exe engine\dist\
          Copy-Item engine\build\Release\*.dll engine\dist\
        shell: pwsh

      - name: Upload engine.exe artifact (with runtime DLLs)
        uses: actions/upload-artifact@v4
        with:
          name: engine-windows
          path: engine\dist\*
          retention-days: 30

  build:
    needs: build-engine
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Sync version from config.py
        run: uv run python scripts/bump_version.py

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress
        shell: cmd

      - name: Download scrcpy/mediamtx binaries
        run: uv run python scripts/download_assets.py
        shell: cmd

      - name: Download engine.exe artifact
        uses: actions/download-artifact@v4
        with:
          name: engine-windows
          path: src\assets\engine

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build apps/web's static export
        # npm is a .cmd shim: without `call`, cmd ends the script after the
        # first one and the build line never runs.
        run: |
          call npm ci || exit /b 1
          call npm run build -w apps/web || exit /b 1
        shell: cmd

      - name: Build EXE with PyInstaller
        run: uv run pyinstaller build/window_control.spec --distpath dist --workpath build/work --noconfirm
        shell: cmd

      - name: Report bundle size
        run: |
          $files = Get-ChildItem dist\EmuCtrl -Recurse -File
          "Total: {0:N1} MB in {1} files" -f (($files | Measure-Object Length -Sum).Sum / 1MB), $files.Count
          $files | Sort-Object Length -Descending | Select-Object -First 40 |
            ForEach-Object { "{0,8:N2} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring((Resolve-Path dist\EmuCtrl).Path.Length + 1) }
        shell: pwsh

      - name: Download VC++ Redistributable
        run: |
          curl -L -o build\vc_redist.x64.exe "https://aka.ms/vs/17/release/vc_redist.x64.exe"
        shell: cmd

      - name: Build installer with Inno Setup
        run: |
          mkdir release
          ISCC build\installer.iss
        shell: cmd

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowControlInstaller
          path: release/EmuCtrlInstaller.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/EmuCtrlInstaller.exe
