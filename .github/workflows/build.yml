name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-engine:
    runs-on: windows-latest
    env:
      # Scripts observed in Windows run 37001202701; registry versions stay
      # pinned separately in engine/vcpkg-configuration.json.
      VCPKG_REVISION: 617ef1c0c422737d117eda00a471ea1be5bad088

    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned vcpkg scripts
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REVISION }}
          path: .vcpkg
          fetch-depth: 0

      - name: Bootstrap pinned vcpkg
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
        shell: pwsh

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            engine/build/vcpkg_installed
            .vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_REVISION }}-${{ hashFiles('engine/vcpkg.json', 'engine/vcpkg-configuration.json', 'engine/ports/**') }}

      - name: Configure (CMake + vcpkg manifest install)
        run: |
          cmake -S engine -B engine\build `
            "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/.vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_OVERLAY_PORTS=engine/ports
        shell: pwsh

      - name: Build
        run: cmake --build engine\build --config Release
        shell: pwsh

      - name: Copy manifest runtime DLLs beside executables
        # libnice/GLib use UNKNOWN imported targets, so CMake's
        # TARGET_RUNTIME_DLLS cannot discover their complete DLL closure.
        run: Copy-Item engine\build\vcpkg_installed\x64-windows\bin\*.dll engine\build\Release\
        shell: pwsh

      - name: Run engine_tests
        run: |
          engine\build\Release\engine_tests.exe
          if ($LASTEXITCODE -ne 0) {
            $failedExit = $LASTEXITCODE
            # Preserve the original failed result; rerun only to capture an
            # unhandled-exception dump, never to turn a failed gate green.
            $diagnostics = Join-Path $env:RUNNER_TEMP 'engine-failure-diagnostics'
            New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
            Invoke-WebRequest 'https://download.sysinternals.com/files/Procdump.zip' -OutFile "$diagnostics\procdump.zip"
            Expand-Archive "$diagnostics\procdump.zip" "$diagnostics\procdump"
            & "$diagnostics\procdump\procdump64.exe" -accepteula -ma -e -x $diagnostics "$env:GITHUB_WORKSPACE\engine\build\Release\engine_tests.exe"
            throw "engine_tests.exe originally failed with exit code $failedExit; diagnostic rerun cannot replace this failure"
          }
        shell: pwsh

      - name: Preserve native failure executable and crash dump
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-failure-diagnostics
          path: |
            engine/build/Release/*.exe
            engine/build/Release/*.dll
            engine/build/Release/*.pdb
            engine/build/CMakeFiles/**/CMakeCXXCompiler.cmake
            ${{ runner.temp }}/engine-failure-diagnostics/*.dmp
          if-no-files-found: warn
          retention-days: 7

      - name: Stage engine.exe + runtime DLLs (flat)
        run: |
          New-Item -ItemType Directory -Force -Path engine\dist | Out-Null
          Copy-Item engine\build\Release\engine.exe engine\dist\
          Copy-Item engine\build\Release\*.dll engine\dist\
          $compilerFile = Get-ChildItem engine\build\CMakeFiles -Recurse -Filter CMakeCXXCompiler.cmake | Select-Object -First 1
          $compilerText = Get-Content $compilerFile.FullName -Raw
          if ($compilerText -notmatch 'VC[/\\]Tools[/\\]MSVC[/\\](\d+\.\d+\.\d+)') {
            throw 'Cannot determine the actual MSVC tool version'
          }
          @{compiler_version = $Matches[1]} | ConvertTo-Json | Set-Content engine\dist\compiler-version.json
          New-Item -ItemType Directory -Force -Path engine\tests-dist | Out-Null
          Copy-Item engine\dist\* engine\tests-dist\
          Copy-Item engine\build\Release\engine_tests.exe engine\tests-dist\
        shell: pwsh

      - name: Upload engine.exe artifact (with runtime DLLs)
        uses: actions/upload-artifact@v4
        with:
          name: engine-windows
          path: engine\dist\*
          retention-days: 30

      - name: Upload staged native tests
        uses: actions/upload-artifact@v4
        with:
          name: engine-tests-windows
          path: engine\tests-dist\*
          if-no-files-found: error
          retention-days: 30

  build:
    needs: build-engine
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Sync version from config.py
        run: uv run python scripts/bump_version.py

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress
        shell: cmd

      - name: Download scrcpy/mediamtx binaries
        run: uv run python scripts/download_assets.py
        shell: cmd

      - name: Download engine.exe artifact
        uses: actions/download-artifact@v4
        with:
          name: engine-windows
          path: src\assets\engine

      - name: Download staged native tests
        uses: actions/download-artifact@v4
        with:
          name: engine-tests-windows
          path: staged-native-tests

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build apps/web's static export
        # npm is a .cmd shim: without `call`, cmd ends the script after the
        # first one and the build line never runs.
        run: |
          call npm install || exit /b 1
          call npm run build -w apps/web || exit /b 1
        shell: cmd

      - name: Build EXE with PyInstaller
        run: uv run pyinstaller build/window_control.spec --distpath dist --workpath build/work --noconfirm
        shell: cmd

      - name: Download VC++ Redistributable
        run: |
          curl -fL -o build\vc_redist.x64.exe "https://aka.ms/vc14/vc_redist.x64.exe"
        shell: cmd

      - name: Verify actual compiler and bundled runtime versions
        run: |
          $file = (Get-Item build\vc_redist.x64.exe).VersionInfo
          $runtime = "$($file.FileMajorPart).$($file.FileMinorPart).$($file.FileBuildPart).$($file.FilePrivatePart)"
          uv run python scripts/validate_windows_runtime.py --compiler-metadata src/assets/engine/compiler-version.json --runtime-version $runtime --output build/runtime-version.json
          if ($LASTEXITCODE -ne 0) { throw 'Bundled VC runtime predates the actual compiler or version is unknown' }
        shell: pwsh

      - name: Execute installer runtime upgrade regression
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          ISCC build\vc_runtime_test.iss
          if ($LASTEXITCODE -ne 0) { throw 'Runtime regression harness compilation failed' }
          $result = Join-Path $env:RUNNER_TEMP 'vc-runtime-regression.txt'
          $process = Start-Process release\VCRuntimeRegression.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /RESULT=$result" -Wait -PassThru
          if (!(Test-Path $result)) { throw "Runtime upgrade regression failed: exit $($process.ExitCode)" }
          Get-Content $result
          Copy-Item $result build\vc-runtime-regression.txt
        shell: pwsh

      - name: Run downloaded native tests without development DLL paths
        run: |
          $runtime = Start-Process build\vc_redist.x64.exe -ArgumentList '/install /quiet /norestart' -Wait -PassThru
          if ($runtime.ExitCode -notin @(0, 1638, 3010)) { throw "VC runtime installation failed: $($runtime.ExitCode)" }
          $stage = Join-Path $env:RUNNER_TEMP 'native-artifact-smoke'
          Copy-Item staged-native-tests $stage -Recurse
          $savedPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32"
            Push-Location $stage
            & .\engine_tests.exe --gtest_output=xml:native-tests.xml
            if ($LASTEXITCODE -ne 0) { throw "Downloaded engine_tests failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
            $env:PATH = $savedPath
          }
          Copy-Item "$stage\native-tests.xml" build\native-tests-staged.xml
        shell: pwsh

      - name: Smoke staged packaged host and current-user DPAPI
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'packaged-host-smoke'
          Copy-Item dist\EmuCtrl $stage -Recurse
          $certificate = Join-Path $env:RUNNER_TEMP 'packaged-smoke-cert.pem'
          $key = Join-Path $env:RUNNER_TEMP 'packaged-smoke-key.pem'
          & 'C:\Program Files\Git\usr\bin\openssl.exe' req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' -keyout $key -out $certificate
          if ($LASTEXITCODE -ne 0) { throw 'Local smoke TLS certificate generation failed' }
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\src"
          uv run python scripts/smoke_windows_package.py --package $stage --certificate $certificate --key $key --output build/packaged-host-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Staged packaged host smoke failed' }
        shell: pwsh

      - name: Build installer with Inno Setup
        run: |
          ISCC build\installer.iss
        shell: cmd

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowControlInstaller
          path: release/EmuCtrlInstaller.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload packaged smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke-evidence
          path: |
            build/runtime-version.json
            build/vc-runtime-regression.txt
            build/native-tests-staged.xml
            build/packaged-host-smoke.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/EmuCtrlInstaller.exe
