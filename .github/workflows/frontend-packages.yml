name: frontend-packages
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run test:core
      - run: npm run test:ui
      - run: npm test -w apps/web
