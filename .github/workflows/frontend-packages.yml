name: frontend-packages
on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run test:core
      - run: npm run test:ui
      - run: npm test -w apps/web
      - run: npm test -w apps/mobile
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install Qt and X display libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      # Win32 APIs are stubbed off Windows, so the whole unit suite runs here.
      # tests/integration needs Docker and runs in the real-turn job.
      - name: Run Python unit tests
        run: xvfb-run -a uv run pytest tests/ apps/desktop/ -q --ignore=tests/integration
  real-turn:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - name: Run real broker and coturn acceptance
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/test_remote_deployment.py tests/integration/test_shared_remote.py -v -s -x --tb=short 2>&1 | tee shared-remote-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-remote-results
          path: shared-remote-results.log
