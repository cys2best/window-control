name: frontend-packages
on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run test:core
      - run: npm run test:ui
      - run: npm test -w apps/web
      - run: npm test -w apps/mobile
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Run Python remote protocol and broker tests
        run: uv run pytest tests/test_remote_protocol.py tests/test_broker.py tests/test_broker_identity.py -v
