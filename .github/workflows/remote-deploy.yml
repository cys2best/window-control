name: Remote deploy

# Manual button. Builds the dispatching branch's HEAD (no arbitrary SHA, so the OIDC branch pin and
# the built code always match), or redeploys an existing ECR tag when image_tag is set (rollback).
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing image tag (40-hex commit SHA) to redeploy without building
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: remote-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1

jobs:
  build:
    if: inputs.image_tag == ''
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Build and push arm64 images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/arm64 -f infra/shared-remote/broker.Dockerfile \
            -t "$REGISTRY/window-control/broker:$TAG" .
          docker build --platform linux/arm64 -f infra/shared-remote/edge.Dockerfile \
            --build-arg REMOTE_ORIGIN=https://${{ vars.REMOTE_HOSTNAME }} \
            -t "$REGISTRY/window-control/edge:$TAG" .
          docker push "$REGISTRY/window-control/broker:$TAG"
          docker push "$REGISTRY/window-control/edge:$TAG"

  deploy:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Run the deploy script on the instance
        env:
          INSTANCE_ID: ${{ vars.REMOTE_INSTANCE_ID }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "image_tag must be a 40-hex commit SHA"; exit 1; }
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          COMMANDS=$(jq -cn --arg sha "$GIT_SHA" --arg tag "$IMAGE_TAG" --arg account "$ACCOUNT_ID" '{commands: [
            "set -euo pipefail",
            "work=$(mktemp -d)",
            "trap \"rm -rf $work\" EXIT",
            "curl -fsSL https://codeload.github.com/cys2best/window-control/tar.gz/\($sha) | tar -xz -C \"$work\" --strip-components=1",
            "bash \"$work/infra/aws/files/shared-remote-deploy.sh\" \($sha) \($tag) \($account)"
          ], executionTimeout: ["900"]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "deploy $GIT_SHA" \
            --parameters "$COMMANDS" --query Command.CommandId --output text)
          echo "SSM command $COMMAND_ID"
          for _ in $(seq 1 120); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $STATUS"
          [ "$STATUS" = Success ]
