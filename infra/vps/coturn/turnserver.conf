listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0
external-ip=<VPS_PUBLIC_IP>

fingerprint
lt-cred-mech
# Real credential lives only on the VPS (not in git) -- generate with
# `openssl rand -hex 24` and update this line locally on the server, then
# `sudo systemctl restart coturn`. Must match TURN_USERNAME/TURN_CREDENTIAL
# in the PC's .env (see src/config.py).
user=<TURN_USERNAME>:<TURN_CREDENTIAL>
realm=webrtc.local

min-port=49160
max-port=49200

no-cli
no-tlsv1
no-tlsv1_1

log-file=/var/log/turnserver.log
verbose
